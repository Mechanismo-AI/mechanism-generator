name: Verify published model assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-models:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r docs/requirements-engine-cpu.txt ".[engine]"
      - run: mechanism-models download --directory models
      - run: mechanism-models verify --directory models
      - run: python tools/smoke_release.py --models-directory models
