name: Experimental motion package

on:
  push:
    paths:
      - 'experimental/motion/**'
      - '.github/workflows/experimental-motion.yml'
  pull_request:
    paths:
      - 'experimental/motion/**'
      - '.github/workflows/experimental-motion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MOTION_TEST_INSTALLED: '1'
    defaults:
      run:
        working-directory: experimental/motion
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.5.1 build
      - run: python -m build
      - run: python -m pip install --no-deps dist/mechanism_motion_experimental-0.1.0.dev0-py3-none-any.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m mechanism_motion examples/normalized-motion.json --seed 580000050 --output result.json
