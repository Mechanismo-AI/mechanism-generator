name: OMTS validation and packaging

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest
      - run: python -m build
      - run: omts validate examples/omts/three_point.omts.yaml
      - run: omts validate examples/omts/synchronized_line.omts.yaml
      - run: omts adapt examples/omts/three_point.omts.yaml --output-dir generated/ci
