spec: open-mechanism-task
version: 0.1.0
task_set_id: tabletop_transfer_panel_v1
name: Tabletop transfer platform with sampled panel screening
description: Same frozen physical brief as tabletop_transfer.omts.yaml. Physical XY
  = 30 * normalized XY + [250,40] mm. Integrates angular-tolerance initialization
  and full-turn sampled panel/carrier containment; no collision, thickness, load or
  hardware validation.
capabilities_required:
- planar_2d
- cyclic_motion
- target_positions
- target_orientation
- four_bar
- hybrid_ground_link_portfolio
- sampled_panel_containment
- tolerance_aware_pose_initialization
unsupported_feature_policy: error
units:
  length: normalized
  angle: deg
  time: s
coordinate_system:
  frame_id: world
  dimension: 2
  handedness: right
  axes:
    x: right
    y: up
outputs:
  top_k: 5
  formats:
  - json
  - csv
  - npz
  include_lineage: true
  include_histories: true
  requested_validation_level: kinematic_candidate
tasks:
- id: tabletop_transfer
  motion:
    mode: cyclic
    order_policy: ordered
    cycle:
      phase_start: 0
      phase_end: 360
      direction: either
      independent_variable: phase
    targets:
    - id: T1
      position:
      - -5.0
      - 2.0
      orientation:
        type: planar_angle
        value: -10.0
      occurrence:
        free: true
        order_index: 1
      tolerance:
        position: 0.05
        orientation: 3.0
      mode: hard
    - id: T2
      position:
      - -3.0
      - 3.3333333333333335
      orientation:
        type: planar_angle
        value: 0.0
      occurrence:
        free: true
        order_index: 2
      tolerance:
        position: 0.05
        orientation: 3.0
      mode: hard
    - id: T3
      position:
      - -1.0
      - 2.0
      orientation:
        type: planar_angle
        value: 10.0
      occurrence:
        free: true
        order_index: 3
      tolerance:
        position: 0.05
        orientation: 3.0
      mode: hard
  mechanism_search:
    allowed_topologies:
    - four_bar
    max_dof: 1
    max_actuators: 1
    ground_link:
      mode: portfolio
      fixed_values:
      - 6.0
      trust_fraction: 0.25
      release: true
    assembly_branches:
    - open
    - crossed
    profiles:
    - accuracy
    - balanced
    - transmission
    profile_matrix: paired
    portfolio:
      fixed_seed_count: 3
      bridge_profile_matrix: paired
      bridge_perturbations: 0
      trust_fraction: 0.25
      release_seed_count: 3
      skip_release: false
      guarantee_fixed_count: 0
  requirements:
    path:
      max_mean_error: 0.03333333333333333
      max_point_error: 0.05
      shared_mean_allowance: 0.02
      shared_point_allowance: 0.05
      mode: hard
    transmission:
      selection_min_at_targets: 15
      selection_min_global: 10
      min_at_targets: 35
      min_global: 15
      objective: worst_target
      mode: soft
    assembly:
      full_cycle_required: true
      min_margin: 0
      mode: hard
    classification:
      grashof_required: true
      input_link_shortest: true
      follower_not_longest: false
      mode: hard
    compactness:
      mode: report_only
    panel:
      bounds:
      - -8.333333333333334
      - 5.0
      - -1.3333333333333333
      - 8.666666666666666
      carrier_size:
      - 1.6666666666666667
      - 0.3333333333333333
      pivot_clearance: 0.3333333333333333
      steps: 7201
      carrier_frame: coupler_A_to_B
      mode: hard
  search:
    implementation_profile: r2.5c-fourbar
    seed: 101
    perturbations_per_model: 0
    parameter_noise: 0.18
    phase_noise: 4
    pose_initialization:
      nominal_samples: 4096
      tolerance_samples: 262144
      seeds_per_branch: 6
