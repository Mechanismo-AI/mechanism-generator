spec: open-mechanism-task
version: 0.1.0
task_set_id: dwell_station_failure_v1
name: Dwell station (case study A) -- hold-still labeling station, three ordered poses on the case-B-mirrored layout
description: >-
  Failure-analysis task for case study A (case-study loop: brief, failure
  analysis, capability): the hold-still labeling station. Physical brief: a
  continuous conveyor passes a labeling station; while the machine keeps
  turning, the carried point must hold still at the station -- within
  0.3 mm of the station point for at least 50 deg of the input cycle. The
  dwell demand itself is NOT encoded in this document: the current OMTS
  draft has no dwell vocabulary, and the failure analysis scores the
  demand on the recorded engine traces instead (claim-only-what-exists;
  see the evidence job). What the document encodes is the pose
  instrument: three ordered poses at packaging tolerance on the
  case-B-mirrored symmetric layout -- the same scale, carry plane and
  normalization convention as the case study B gap transfer, so the dwell
  reading lands in the same units and the same geometry class as the
  recorded six-bar frontier. 1 normalized unit = 100 mm; physical
  XY = 100 * normalized XY, origin at the station on the carry line.
  Approach and depart poses at physical x = -130 and +130 mm; the
  station at x = 0; carry plane at physical y = 50 mm. All three level
  (orientation 0 deg). Tolerances: position 1.5 mm (0.015 normalized),
  orientation 1.5 deg. The current four-bar engine is asked to do the
  job and observed failing; the recorded data is the evidence for the
  dwell capability design. Evidence job: jobs/dwell-station-failure-01.
capabilities_required:
  - planar_2d
  - cyclic_motion
  - target_positions
  - target_orientation
  - four_bar
  - hybrid_ground_link_portfolio
unsupported_feature_policy: error
units: {length: normalized, angle: deg, time: s}
coordinate_system:
  frame_id: world
  dimension: 2
  handedness: right
  axes: {x: right, y: up}
outputs:
  top_k: 5
  formats: [json, csv, npz]
  include_lineage: true
  include_histories: true
  requested_validation_level: kinematic_candidate
tasks:
  - id: dwell_station
    motion:
      mode: cyclic
      order_policy: ordered
      cycle: {phase_start: 0, phase_end: 360, direction: either, independent_variable: phase}
      targets:
        - id: T1
          position: [-1.3, 0.5]
          orientation: {type: planar_angle, value: 0.0}
          occurrence: {free: true, order_index: 1}
          tolerance: {position: 0.015, orientation: 1.5}
          mode: hard
        - id: T2
          position: [0.0, 0.5]
          orientation: {type: planar_angle, value: 0.0}
          occurrence: {free: true, order_index: 2}
          tolerance: {position: 0.015, orientation: 1.5}
          mode: hard
        - id: T3
          position: [1.3, 0.5]
          orientation: {type: planar_angle, value: 0.0}
          occurrence: {free: true, order_index: 3}
          tolerance: {position: 0.015, orientation: 1.5}
          mode: hard
    mechanism_search:
      allowed_topologies: [four_bar]
      max_dof: 1
      max_actuators: 1
      ground_link: {mode: portfolio, fixed_values: [6.0], trust_fraction: 0.25, release: true}
      assembly_branches: [open, crossed]
      profiles: [accuracy, balanced, transmission]
      profile_matrix: paired
      portfolio:
        fixed_seed_count: 3
        bridge_profile_matrix: paired
        bridge_perturbations: 0
        trust_fraction: 0.25
        release_seed_count: 3
        skip_release: false
        guarantee_fixed_count: 0
    requirements:
      path: {max_mean_error: 0.01, max_point_error: 0.015, shared_mean_allowance: 0.004, shared_point_allowance: 0.01, mode: hard}
      transmission: {selection_min_at_targets: 15, selection_min_global: 10, min_at_targets: 35, min_global: 15, objective: worst_target, mode: soft}
      assembly: {full_cycle_required: true, min_margin: 0, mode: hard}
      classification: {grashof_required: true, input_link_shortest: true, follower_not_longest: false, mode: hard}
      compactness: {mode: report_only}
    search:
      implementation_profile: r2.5c-fourbar
      seed: 101
      perturbations_per_model: 0
      parameter_noise: 0.18
      phase_noise: 4
