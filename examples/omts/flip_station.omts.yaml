spec: open-mechanism-task
version: 0.1.0
task_set_id: flip_station_failure_v1
name: Flip station (case study C) -- 180 deg face flip across symmetric handoffs, three ordered poses with directed orientations
description: >-
  Failure-analysis task for case study C (case-study loop: brief,
  failure analysis, capability): the flipper. Physical brief: a flat
  part, 100 x 60 x 5 mm, arrives face-up at handoff one and must be
  handed off face-down at handoff two -- a 180 deg flip about a
  horizontal axis perpendicular to travel. In the machine plane that
  flip is an in-plane rotation of the part's 100 x 5 mm cross-section;
  the 60 mm width is out-of-plane, declared as such per the planar
  scope-control precedent (the in-plane corner sweep radius about the
  centroid is sqrt(50^2 + 2.5^2) = 50.06 mm). 1 normalized unit =
  100 mm; physical XY = 100 * normalized XY, origin at the flip
  center on the handoff line -- the same normalization convention as
  the case A/B task documents, so the recorded outcomes land in the
  same units and geometry class as the recorded frontier. Handoff
  poses at physical x = -130 and +130 mm, both on the carry plane at
  physical y = 50 mm (same height: a flip about the part's centroid
  swaps faces without moving the center). The mid pose at x = 0
  forces the flip through the vertical orientation: the three targets
  are the handoff-one pose (orientation 0 deg), the vertical mid pose
  (orientation 90 deg -- the worst transmission window in the cycle)
  and the handoff-two pose (orientation 180 deg, the directed coupler
  axis reversed). Tolerances: position 1.5 mm (0.015 normalized),
  orientation 1.5 deg. The current four-bar engine is asked to do the
  job and observed failing; the recorded data is the evidence for the
  flipper capability design, and the failure digest additionally
  emits the machine-readable solution corpus this case study owes its
  downstream consumer -- the recorded-outcome feed for the B1
  admission-gate work (docs/strategy.md). Evidence job:
  jobs/flip-station-failure-01.
capabilities_required:
  - planar_2d
  - cyclic_motion
  - target_positions
  - target_orientation
  - four_bar
  - hybrid_ground_link_portfolio
unsupported_feature_policy: error
units: {length: normalized, angle: deg, time: s}
coordinate_system:
  frame_id: world
  dimension: 2
  handedness: right
  axes: {x: right, y: up}
outputs:
  top_k: 5
  formats: [json, csv, npz]
  include_lineage: true
  include_histories: true
  requested_validation_level: kinematic_candidate
tasks:
  - id: flip_station
    motion:
      mode: cyclic
      order_policy: ordered
      cycle: {phase_start: 0, phase_end: 360, direction: either, independent_variable: phase}
      targets:
        - id: T1
          position: [-1.3, 0.5]
          orientation: {type: planar_angle, value: 0.0}
          occurrence: {free: true, order_index: 1}
          tolerance: {position: 0.015, orientation: 1.5}
          mode: hard
        - id: T2
          position: [0.0, 0.5]
          orientation: {type: planar_angle, value: 90.0}
          occurrence: {free: true, order_index: 2}
          tolerance: {position: 0.015, orientation: 1.5}
          mode: hard
        - id: T3
          position: [1.3, 0.5]
          orientation: {type: planar_angle, value: 180.0}
          occurrence: {free: true, order_index: 3}
          tolerance: {position: 0.015, orientation: 1.5}
          mode: hard
    mechanism_search:
      allowed_topologies: [four_bar]
      max_dof: 1
      max_actuators: 1
      ground_link: {mode: portfolio, fixed_values: [6.0], trust_fraction: 0.25, release: true}
      assembly_branches: [open, crossed]
      profiles: [accuracy, balanced, transmission]
      profile_matrix: paired
      portfolio:
        fixed_seed_count: 3
        bridge_profile_matrix: paired
        bridge_perturbations: 0
        trust_fraction: 0.25
        release_seed_count: 3
        skip_release: false
        guarantee_fixed_count: 0
    requirements:
      path: {max_mean_error: 0.01, max_point_error: 0.015, shared_mean_allowance: 0.004, shared_point_allowance: 0.01, mode: hard}
      transmission: {selection_min_at_targets: 15, selection_min_global: 10, min_at_targets: 35, min_global: 15, objective: worst_target, mode: soft}
      assembly: {full_cycle_required: true, min_margin: 0, mode: hard}
      classification: {grashof_required: true, input_link_shortest: true, follower_not_longest: false, mode: hard}
      compactness: {mode: report_only}
    search:
      implementation_profile: r2.5c-fourbar
      seed: 101
      perturbations_per_model: 0
      parameter_noise: 0.18
      phase_noise: 4
