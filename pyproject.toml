[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanism-generator"
version = "0.1.0a1"
description = "Open Mechanism Task Specification validation and research run preparation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Mechanismo-AI contributors"}]
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2"]

[project.urls]
Repository = "https://github.com/Mechanismo-AI/mechanism-generator"
Issues = "https://github.com/Mechanismo-AI/mechanism-generator/issues"

[project.scripts]
omts = "mechanism_generator.omts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mechanism_generator.omts" = ["schema.json", "r25c_capabilities.json", "runner_template.py.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
